<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>viewBox scaling of wobble</title>
<style>
  body{ background:#FAF6EC; color:#2A2723; font-family:"Candara","Yu Gothic",sans-serif; margin:0; padding:20px 30px; }
  h2{ font-size:18px; margin:20px 0 8px; border-bottom:2px solid #2A2723; }
  .row{ display:flex; align-items:center; gap:40px; margin:10px 0 18px; }
  .c{ text-align:center; font-size:12px; font-weight:bold; }
  .c svg{ display:block; margin:0 auto 4px; }
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- V=80想定（小帯） -->
  <filter id="w-s" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055 0.07" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.0" xChannelSelector="R" yChannelSelector="G"/></filter>
  <!-- V=18想定（極小帯 4.5/18=0.25, 18/27=0.67） -->
  <filter id="w-xs" x="-40%" y="-40%" width="180%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency="0.25 0.31" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.67" xChannelSelector="R" yChannelSelector="G"/></filter>
  <!-- V=60想定（4.5/60=0.075, 60/27=2.2） -->
  <filter id="w-60" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.075 0.095" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>

  <symbol id="ck0" viewBox="0 0 18 16"><g><path d="M2 8 L7 13 L16 3" stroke="#3E6B6E" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></symbol>
  <symbol id="ckS" viewBox="0 0 18 16"><g filter="url(#w-s)"><path d="M2 8 L7 13 L16 3" stroke="#3E6B6E" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></symbol>
  <symbol id="ckX" viewBox="0 0 18 16"><g filter="url(#w-xs)"><path d="M2 8 L7 13 L16 3" stroke="#3E6B6E" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></symbol>

  <symbol id="ar0" viewBox="0 0 60 24"><g>
    <path d="M2 12 Q30 6 48 12" fill="none" stroke="#2A2723" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M48 12 L40 7 M48 12 L40 17" fill="none" stroke="#2A2723" stroke-width="2.2" stroke-linecap="round"/></g></symbol>
  <symbol id="arS" viewBox="0 0 60 24"><g filter="url(#w-s)">
    <path d="M2 12 Q30 6 48 12" fill="none" stroke="#2A2723" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M48 12 L40 7 M48 12 L40 17" fill="none" stroke="#2A2723" stroke-width="2.2" stroke-linecap="round"/></g></symbol>
  <symbol id="ar6" viewBox="0 0 60 24"><g filter="url(#w-60)">
    <path d="M2 12 Q30 6 48 12" fill="none" stroke="#2A2723" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M48 12 L40 7 M48 12 L40 17" fill="none" stroke="#2A2723" stroke-width="2.2" stroke-linecap="round"/></g></symbol>
</svg>

<h2>check-mark（viewBox 18×16）を 18px と 54px で表示</h2>
<div class="row">
  <div class="c"><svg width="18" height="16"><use href="#ck0"/></svg>なし 18px</div>
  <div class="c"><svg width="18" height="16"><use href="#ckS"/></svg>小帯 18px（誤用）</div>
  <div class="c"><svg width="18" height="16"><use href="#ckX"/></svg>極小帯 18px</div>
  <div class="c"><svg width="54" height="48"><use href="#ck0"/></svg>なし 54px</div>
  <div class="c"><svg width="54" height="48"><use href="#ckS"/></svg>小帯 54px（誤用）</div>
  <div class="c"><svg width="54" height="48"><use href="#ckX"/></svg>極小帯 54px</div>
</div>

<h2>hand-arrow（viewBox 60×24）を 60px と 150px で表示</h2>
<div class="row">
  <div class="c"><svg width="60" height="24"><use href="#ar0"/></svg>なし 60px</div>
  <div class="c"><svg width="60" height="24"><use href="#arS"/></svg>小帯 60px</div>
  <div class="c"><svg width="60" height="24"><use href="#ar6"/></svg>V=60調整 60px</div>
</div>
<div class="row">
  <div class="c"><svg width="150" height="60"><use href="#ar0"/></svg>なし 150px</div>
  <div class="c"><svg width="150" height="60"><use href="#arS"/></svg>小帯 150px</div>
  <div class="c"><svg width="150" height="60"><use href="#ar6"/></svg>V=60調整 150px</div>
</div>
</body></html>
